name: Build

on:
  workflow_call:
    inputs:
      upload-package-dists:
        description: "Upload built packages/*/dist for a later publish job"
        required: false
        type: boolean
        default: false

env:
  NODE_ENV: production

jobs:
  build:
    runs-on: 16-core-runner-fren-1

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Install and cache JS toolchain and dependencies (node_modules)
      - name: Setup JS
        uses: ./.github/actions/js-setup

      # Just to stay on the safe side
      - name: Clean
        run: pnpm clean

      # Even though typecheck turbo task depends on ^build, we still want to run it explicitly
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Prettier
        run: pnpm prettier-all:check

      # This is to catch when someone forgets to run `pnpm run version` after bumping package versions as well as check to make sure codegen output is up to date.
      # Both of these things will cause git to be dirty after the build step.
      - name: Run version script
        run: pnpm version

      - name: Run codegen
        run: pnpm codegen-all

      # Run prettier again after codegen to ensure generated code is formatted correctly
      - name: Run prettier
        run: pnpm prettier-codegen:write

      - name: Ensure git is clean
        run: |
          if [ -z "$( git status --porcelain )" ]; then
            echo "Git is clean!"
            exit 0
          else
            echo "Git is dirty!"
            git add -A
            git --no-pager diff HEAD
            exit 1
          fi

      # publish-npm downloads these instead of compiling on package-deploy.
      # Each package keeps its own dist directory so outputs cannot be mixed.
      - name: Pack package dists
        if: ${{ inputs.upload-package-dists }}
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/package-dists"
          rm -rf "$stage"
          mkdir -p "$stage"
          missing=0
          for dir in packages/*; do
            [ -f "$dir/package.json" ] || continue
            name="$(basename "$dir")"
            private="$(node -p "require('./${dir}/package.json').private === true")"
            if [ "$private" = "true" ]; then
              echo "skip private ${name}"
              continue
            fi
            if [ ! -d "$dir/dist" ]; then
              echo "missing dist for ${name}"
              missing=1
              continue
            fi
            mkdir -p "$stage/$name"
            cp -a "$dir/dist" "$stage/$name/dist"
            echo "packed ${name}"
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Upload package dists
        if: ${{ inputs.upload-package-dists }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-dists
          path: ${{ runner.temp }}/package-dists
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 5
