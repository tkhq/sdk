name: Comment on preview packages

on:
  workflow_run:
    workflows:
      - Preview packages
    types:
      - completed

concurrency:
  cancel-in-progress: true
  group: preview-package-comment-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}

permissions: {}

jobs:
  validate:
    name: Validate preview packages
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact-digest: ${{ steps.select.outputs.artifact-digest }}
      artifact-url: ${{ steps.select.outputs.artifact-url }}
      head-sha: ${{ steps.select.outputs.head-sha }}
      manifest: ${{ steps.validate.outputs.manifest }}
      pr-number: ${{ steps.select.outputs.pr-number }}
      status: ${{ steps.select.outputs.status }}

    steps:
      - name: Checkout validation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Select preview artifact
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const pullRequest = run.pull_requests?.[0];

            if (!pullRequest?.number || !pullRequest.head?.sha) {
              core.setOutput("status", "skip");
              return;
            }

            const { data: currentPullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullRequest.number,
            });

            core.setOutput("head-sha", pullRequest.head.sha);
            core.setOutput("pr-number", pullRequest.number);

            const hasPreviewLabel = currentPullRequest.labels.some(
              (label) => label.name === "preview-packages",
            );
            if (
              currentPullRequest.head.sha !== pullRequest.head.sha ||
              !hasPreviewLabel
            ) {
              core.setOutput("status", "skip");
              return;
            }

            if (["cancelled", "neutral", "skipped"].includes(run.conclusion)) {
              core.setOutput("status", "skip");
              return;
            }

            if (run.conclusion !== "success") {
              core.setOutput("status", "failure");
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                ...context.repo,
                run_id: run.id,
                per_page: 100,
              },
            );
            const expectedName = `preview-packages-pr-${pullRequest.number}-${pullRequest.head.sha}`;
            const artifact = artifacts.find(
              (candidate) => candidate.name === expectedName,
            );

            if (!artifact || artifact.expired) {
              core.setOutput("status", "skip");
              return;
            }

            const digest = artifact.digest?.replace(/^sha256:/, "") ?? "";
            if (digest && !/^[a-f0-9]{64}$/.test(digest)) {
              throw new Error(`Invalid artifact digest: ${artifact.digest}`);
            }

            core.setOutput("artifact-digest", digest);
            core.setOutput("artifact-id", artifact.id);
            core.setOutput(
              "artifact-url",
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}/artifacts/${artifact.id}`,
            );
            core.setOutput("status", "success");

      - name: Download preview artifact
        if: steps.select.outputs.status == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select.outputs.artifact-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/preview-packages
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate package manifest
        id: validate
        if: steps.select.outputs.status == 'success'
        env:
          PREVIEW_DIRECTORY: ${{ runner.temp }}/preview-packages
        run: |
          manifest="$(node .github/scripts/validate-preview-package-manifest.mjs "$PREVIEW_DIRECTORY")"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

  comment:
    name: Comment on pull request
    if: >-
      always() &&
      needs.validate.outputs.pr-number != '' &&
      needs.validate.outputs.status != 'skip' &&
      needs.validate.result != 'cancelled'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Create or update preview package comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_DIGEST: ${{ needs.validate.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ needs.validate.outputs.artifact-url }}
          HEAD_SHA: ${{ needs.validate.outputs.head-sha }}
          MANIFEST_BASE64: ${{ needs.validate.outputs.manifest }}
          PR_NUMBER: ${{ needs.validate.outputs.pr-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
          STATUS: ${{ needs.validate.outputs.status }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        with:
          script: |
            const marker = "<!-- preview-packages -->";
            const issueNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            const shortSha = process.env.HEAD_SHA.slice(0, 7);
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${process.env.HEAD_SHA}`;
            const succeeded =
              process.env.STATUS === "success" &&
              process.env.VALIDATION_RESULT === "success";

            const { data: currentPullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: issueNumber,
            });
            const hasPreviewLabel = currentPullRequest.labels.some(
              (label) => label.name === "preview-packages",
            );
            if (
              currentPullRequest.head.sha !== process.env.HEAD_SHA ||
              !hasPreviewLabel
            ) {
              core.info("Skipping a stale preview package comment");
              return;
            }

            let body;
            if (succeeded) {
              const packages = JSON.parse(
                Buffer.from(process.env.MANIFEST_BASE64, "base64").toString("utf8"),
              );
              const example = packages.find(
                (entry) => entry.name === "@turnkey/sdk-server",
              ) ?? packages[0];
              const rows = packages.map((entry) => {
                const size = `${(entry.size / 1024).toFixed(1)} KiB`;
                return `| \`${entry.name}\` | \`${entry.version}\` | \`${entry.filename}\` | ${size} | \`${entry.sha256}\` |`;
              });
              const artifactDigest = process.env.ARTIFACT_DIGEST
                ? [`Artifact SHA-256: \`${process.env.ARTIFACT_DIGEST}\``, ""]
                : [];

              body = [
                marker,
                "## Preview packages",
                "",
                `Built from [\`${shortSha}\`](${commitUrl}).`,
                "",
                `[Download all package tarballs](${process.env.ARTIFACT_URL}). GitHub stores the tarballs in a ZIP file for 30 days. GitHub sign-in is required to download it.`,
                "",
                "Extract the ZIP file, then install one tarball from the extracted directory:",
                "",
                "```sh",
                `npm install ./${example.filename}`,
                "```",
                "",
                "If the change spans multiple workspace packages, install those tarballs together in one command.",
                "These preview tarballs keep their current package versions and are not npm releases.",
                "",
                ...artifactDigest,
                "| Package | Version | Tarball | Size | SHA-256 |",
                "| --- | --- | --- | ---: | --- |",
                ...rows,
              ].join("\n");
            } else {
              body = [
                marker,
                "## Preview packages",
                "",
                `The preview package build or artifact validation failed for [\`${shortSha}\`](${commitUrl}).`,
                `[View the workflow run](${process.env.RUN_URL}) for details.`,
              ].join("\n");
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                ...context.repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );
            const existingComment = comments.find(
              (comment) =>
                comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body,
              });
            }
