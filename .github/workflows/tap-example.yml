name: TAP example

on:
  pull_request:
    paths:
      - "examples/identity/with-tap/**"
      - "packages/sdk-server/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/actions/js-setup/**"
      - ".github/workflows/tap-example.yml"
  push:
    branches: [main]
    paths:
      - "examples/identity/with-tap/**"
      - "packages/sdk-server/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/actions/js-setup/**"
      - ".github/workflows/tap-example.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup SDK tooling
        uses: ./.github/actions/js-setup
        with:
          turbo-cache-scope: tap-
      - name: Build the checked SDK adapter
        run: pnpm --filter @turnkey/sdk-server... build
      - name: Prepare the pinned upstream source and reviewed patch
        run: pnpm --filter @turnkey/example-tap prepare:mppx
      - name: Run the offline example
        run: pnpm --filter @turnkey/example-tap demo
      - name: Check the actual TAP API and integration behavior
        run: |
          pnpm --filter @turnkey/example-tap typecheck:tap
          pnpm --filter @turnkey/example-tap test:tap
